<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Coast Heating & Cooling - Missed-call textback demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    color: #eee;
  }
  .phone {
    width: 380px;
    max-width: 94vw;
    background: #000;
    border-radius: 44px;
    padding: 12px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.7), 0 0 0 2px #2a2a2a;
    position: relative;
  }
  .notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 26px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 5;
  }
  .screen {
    background: #1c1c1e;
    border-radius: 34px;
    overflow: hidden;
    height: 600px;
    display: flex;
    flex-direction: column;
  }
  .phone-header {
    background: #2c2c2e;
    padding: 42px 16px 12px;
    text-align: center;
    border-bottom: 1px solid #3a3a3c;
    flex-shrink: 0;
  }
  .phone-header .biz-name {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  .phone-header .biz-phone {
    font-size: 12px;
    color: #9a9a9e;
    margin-top: 3px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .banner {
    background: #c62828;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    padding: 10px 12px;
    border-radius: 12px;
    transform: translateY(-140%);
    opacity: 0;
    transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.4s ease;
  }
  .banner.show {
    transform: translateY(0);
    opacity: 1;
  }
  .row { display: flex; width: 100%; }
  .row.left { justify-content: flex-start; }
  .row.right { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .bubble.show { opacity: 1; transform: translateY(0); }
  .bubble.biz {
    background: #3a3a3c;
    color: #fff;
    border-bottom-left-radius: 4px;
  }
  .bubble.cust {
    background: #0a84ff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .typing {
    display: inline-flex;
    gap: 5px;
    padding: 12px 16px;
    background: #3a3a3c;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    align-self: flex-start;
  }
  .typing span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #aaa;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }
  .caption {
    margin-top: 20px;
    font-size: 15px;
    color: #bbb;
    text-align: center;
    max-width: 380px;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .caption.show { opacity: 1; }
  .replay {
    margin-top: 18px;
    background: #0a84ff;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px 30px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  .replay:hover { background: #2b96ff; }
  .replay:active { transform: scale(0.97); }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="phone-header">
      <div class="biz-name">Third Coast Heating & Cooling</div>
      <div class="biz-phone">262-264-8626</div>
    </div>
    <div class="messages" id="messages"></div>
  </div>
</div>

<p class="caption" id="caption">This happens automatically, 24/7. even at 2am, even when you're in a crawlspace.</p>
<button class="replay" id="replayBtn">Replay demo</button>

<script>
(function() {
  var messagesEl = document.getElementById('messages');
  var captionEl = document.getElementById('caption');
  var timers = [];

  function later(ms, fn) {
    timers.push(setTimeout(fn, ms));
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBanner() {
    var b = document.createElement('div');
    b.className = 'banner';
    b.textContent = 'Missed call from (555) 014-2281';
    messagesEl.appendChild(b);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        b.classList.add('show');
        scrollDown();
      });
    });
  }

  function addTyping() {
    var row = document.createElement('div');
    row.className = 'row left';
    row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(row);
    scrollDown();
    return row;
  }

  function addBubble(side, text) {
    var row = document.createElement('div');
    row.className = 'row ' + side;
    var b = document.createElement('div');
    b.className = 'bubble ' + (side === 'left' ? 'biz' : 'cust');
    b.textContent = text;
    row.appendChild(b);
    messagesEl.appendChild(row);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        b.classList.add('show');
        scrollDown();
      });
    });
  }

  function clearAll() {
    timers.forEach(clearTimeout);
    timers = [];
    messagesEl.innerHTML = '';
    captionEl.classList.remove('show');
  }

  function run() {
    clearAll();
    var t = 400;

    later(t, addBanner);

    function bizReply(text) {
      t += 1200;
      var typingRow;
      later(t, function() { typingRow = addTyping(); });
      t += 1400;
      later(t, function() {
        if (typingRow) typingRow.remove();
        addBubble('left', text);
      });
    }

    function custReply(text) {
      t += 1100;
      later(t, function() { addBubble('right', text); });
    }

    t += 300;
    bizReply("Hi, this is Third Coast Heating & Cooling - sorry we missed your call! What do you need help with?");
    custReply("Furnace died and it's freezing in here");
    bizReply("Got it - that's urgent. Our tech can be there today between 2-4pm. Does that work for you?");
    custReply("Yes please");
    bizReply("You're booked for today 2-4pm. We'll text you when we're on the way.");

    t += 1300;
    later(t, function() {
      captionEl.classList.add('show');
    });
  }

  document.getElementById('replayBtn').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
